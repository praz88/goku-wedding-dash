name: Backfill play events
on:
  workflow_dispatch:
    inputs:
      events_b64:
        description: base64 of JSON lines to append to /data/events.jsonl
        required: true
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: curl -sS -o /dev/null https://goku-wedding-dash.fly.dev/health; sleep 3
      - run: |
          B64="${{ inputs.events_b64 }}"
          flyctl ssh console -a goku-wedding-dash -C "sh -c 'echo $B64 | base64 -d >> /data/events.jsonl && wc -l /data/events.jsonl'"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
