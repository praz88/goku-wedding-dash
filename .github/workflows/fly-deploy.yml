name: Deploy to Fly.io
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Ensure leaderboard volume exists
        run: |
          if ! flyctl volumes list -a goku-wedding-dash | grep -q ' data '; then
            flyctl volumes create data -a goku-wedding-dash -r sin -s 1 -n 1 -y
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Remove machines that have no volume (one-time migration)
        run: |
          flyctl volumes list -a goku-wedding-dash
          for id in $(flyctl machines list -a goku-wedding-dash --json | jq -r '.[] | select((.config.mounts // []) | length == 0) | .id'); do
            echo "destroying volume-less machine $id"; flyctl machine destroy "$id" -a goku-wedding-dash --force
          done
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
